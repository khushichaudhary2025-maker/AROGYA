<meta charset="UTF-8">

<title>Arogya - Find Nearby Pharmacies</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --teal-dark:#0d6e7a; --teal:#1a9bab; --teal-light:#2ec4b6;
    --green:#38b44a; --cream:#f4faf8; --dark:#0a2a2f;
    --mid:#1c4a52; --text:#1a3a3f; --muted:#6b9aa0;
    --border:rgba(26,155,171,0.15);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--text); height:100vh; display:flex; flex-direction:column; }

  nav { display:flex; align-items:center; justify-content:space-between; padding:10px 40px; background:rgba(244,250,248,0.97); border-bottom:1px solid var(--border); z-index:1000; flex-shrink:0; }
  .nav-logo { display:flex; align-items:center; gap:8px; text-decoration:none; }
  .nav-logo img { height:48px; width:auto; object-fit:contain; }
  .nav-logo span { font-family:'Syne',sans-serif; font-weight:800; font-size:20px; color:var(--teal-dark); letter-spacing:1px; }
  .nav-back { background:linear-gradient(135deg,var(--teal-dark),var(--teal)); color:white; border:none; padding:8px 20px; border-radius:50px; font-family:'DM Sans',sans-serif; font-weight:600; font-size:13px; cursor:pointer; text-decoration:none; }

  .search-bar { background:white; padding:14px 40px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; flex-shrink:0; box-shadow:0 2px 12px rgba(13,110,122,0.06); position:relative; }
  .search-input-wrap { flex:1; display:flex; align-items:center; background:var(--cream); border:1.5px solid var(--border); border-radius:50px; padding:10px 20px; gap:10px; transition:border-color .2s; position:relative; }
  .search-input-wrap:focus-within { border-color:var(--teal); }
  .search-input-wrap input { border:none; background:transparent; outline:none; font-family:'DM Sans',sans-serif; font-size:15px; color:var(--text); width:100%; }
  .search-input-wrap input::placeholder { color:var(--muted); }

  /* AUTOCOMPLETE DROPDOWN */
  .suggestions {
    position:absolute; top:100%; left:0; right:0;
    background:white; border:1px solid var(--border);
    border-radius:16px; margin-top:8px; z-index:500;
    box-shadow:0 8px 32px rgba(13,110,122,0.15);
    max-height:280px; overflow-y:auto; display:none;
  }
  .suggestions.show { display:block; }
  .suggestion-item {
    padding:12px 20px; cursor:pointer; transition:background .15s;
    display:flex; align-items:center; gap:10px; font-size:14px;
    border-bottom:1px solid #f0f8f7;
  }
  .suggestion-item:last-child { border-bottom:none; }
  .suggestion-item:hover { background:rgba(26,155,171,0.06); }
  .suggestion-icon { color:var(--teal); font-size:14px; flex-shrink:0; }
  .suggestion-name { font-weight:600; color:var(--dark); }
  .suggestion-state { font-size:12px; color:var(--muted); margin-top:1px; }

  .btn-search { background:linear-gradient(135deg,var(--teal-dark),var(--teal)); color:white; border:none; padding:12px 28px; border-radius:50px; font-family:'DM Sans',sans-serif; font-weight:600; font-size:14px; cursor:pointer; white-space:nowrap; transition:all .2s; box-shadow:0 4px 16px rgba(13,110,122,0.3); }
  .btn-search:hover { transform:translateY(-1px); }
  .btn-locate { background:white; color:var(--teal-dark); border:1.5px solid var(--teal); padding:12px 20px; border-radius:50px; font-family:'DM Sans',sans-serif; font-weight:600; font-size:14px; cursor:pointer; white-space:nowrap; transition:all .2s; display:flex; align-items:center; gap:6px; }
  .btn-locate:hover { background:var(--teal); color:white; }

  .main { flex:1; display:flex; overflow:hidden; }

  .sidebar { width:370px; flex-shrink:0; background:white; border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .sidebar-header { padding:18px 22px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .sidebar-header h3 { font-family:'Syne',sans-serif; font-weight:700; font-size:16px; color:var(--dark); }
  .sidebar-location { font-size:12px; color:var(--muted); margin-top:2px; }
  .count-badge { background:linear-gradient(135deg,var(--teal),var(--green)); color:white; padding:3px 12px; border-radius:50px; font-size:12px; font-weight:600; white-space:nowrap; }

  .pharmacy-list { flex:1; overflow-y:auto; padding:12px; }
  .pharmacy-list::-webkit-scrollbar { width:4px; }
  .pharmacy-list::-webkit-scrollbar-thumb { background:var(--teal-light); border-radius:4px; }

  .pharmacy-card { background:var(--cream); border-radius:16px; padding:16px; margin-bottom:10px; cursor:pointer; transition:all .2s; border:1.5px solid transparent; }
  .pharmacy-card:hover, .pharmacy-card.active { border-color:var(--teal); background:white; box-shadow:0 4px 20px rgba(13,110,122,0.1); transform:translateX(3px); }
  .pharmacy-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .pharmacy-name { font-family:'Syne',sans-serif; font-weight:700; font-size:14px; color:var(--dark); }
  .open-badge   { background:#e8f8ee; color:#1a7a3a; font-size:10px; font-weight:700; padding:3px 9px; border-radius:50px; white-space:nowrap; flex-shrink:0; }
  .closed-badge { background:#fef0f0; color:#c0392b; font-size:10px; font-weight:700; padding:3px 9px; border-radius:50px; white-space:nowrap; flex-shrink:0; }
  .pharmacy-addr { font-size:12px; color:var(--muted); margin:5px 0 8px; line-height:1.5; }
  .pharmacy-meta { display:flex; gap:10px; flex-wrap:wrap; }
  .meta-item { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:3px; }
  .meta-item span { font-weight:600; color:var(--teal-dark); }
  .ph-actions { display:flex; gap:8px; margin-top:12px; }
  .btn-dir  { flex:1; background:linear-gradient(135deg,var(--teal-dark),var(--teal)); color:white; border:none; padding:8px; border-radius:10px; font-size:12px; font-weight:600; cursor:pointer; }
  .btn-call { background:white; color:var(--teal-dark); border:1.5px solid var(--teal); padding:8px 12px; border-radius:10px; font-size:12px; font-weight:600; cursor:pointer; }

  #map { flex:1; }

  .loading { position:absolute; inset:0; background:rgba(244,250,248,0.93); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:2000; gap:14px; }
  .loading.hidden { display:none; }
  .spinner { width:48px; height:48px; border:4px solid var(--border); border-top-color:var(--teal); border-radius:50%; animation:spin .8s linear infinite; }
  .loading p { color:var(--teal-dark); font-weight:600; font-size:15px; }

  .no-result { text-align:center; padding:40px 20px; color:var(--muted); }
  .no-result div { font-size:40px; margin-bottom:12px; }
  .no-result p { font-size:14px; line-height:1.6; }

  @keyframes spin { to { transform:rotate(360deg); } }

  @media(max-width:768px) {
    .main { flex-direction:column; }
    .sidebar { width:100%; height:300px; border-right:none; border-top:1px solid var(--border); order:2; }
    #map { flex:1; order:1; min-height:300px; }
    nav { padding:10px 20px; }
    .search-bar { padding:12px 20px; flex-wrap:wrap; }
  }
</style>
</head>
<body>

<nav>

<div class="loading hidden" id="loading">

</div>

// ── PHARMACY NAME POOL ──
const PHARMACY_NAMES = [
  "Apollo Pharmacy", "MedPlus Pharmacy", "Jan Aushadhi Kendra",
  "Life Care Medical", "City Medical Store", "Wellness Pharmacy",
  "Sanjivani Medicals", "Dhanwantari Pharmacy", "Healthway Medical",
  "Care & Cure Pharmacy", "Shree Medical Store", "Om Pharmacy",
  "Balaji Medical Hall", "New India Pharmacy", "Sunrise Medical",
  "Aarogya Medical", "Swasthya Pharmacy", "Jeevan Pharmacy",
  "Medicare Store", "Health Plus Pharmacy"
];

const STREET_NAMES = [
  "Main Road", "Station Road", "Civil Lines", "Gandhi Nagar",
  "MG Road", "Nehru Nagar", "Subhash Chowk", "Market Road",
  "Bus Stand Road", "Hospital Road", "Lal Bagh", "Sadar Bazaar",
  "Raja Road", "Collector Ganj", "Bypass Road", "Mall Road"
];

const HOURS_LIST = ["24 Hours","8AM-10PM","9AM-9PM","7AM-11PM","8AM-9PM","9AM-11PM"];

// ── GENERATE PHARMACIES AROUND COORDINATES ──
function generatePharmacies(lat, lng, cityName) {
  const city = cityName.split(',')[0].trim();
  const shuffled = [...PHARMACY_NAMES].sort(() => Math.random() - 0.5).slice(0, 9);
  return shuffled.map((name, i) => ({
    name,
    address:  STREET_NAMES[i % STREET_NAMES.length] + ", " + city,
    lat:      lat + (Math.random() - 0.5) * 0.025,
    lng:      lng + (Math.random() - 0.5) * 0.025,
    phone:    "98" + Math.floor(10000000 + Math.random() * 89999999),
    hours:    HOURS_LIST[i % HOURS_LIST.length],
    rating:   (3.8 + Math.random() * 1.1).toFixed(1),
    open:     Math.random() > 0.2,
    dist:     (0.2 + Math.random() * 2.8).toFixed(1) + " km"
  })).sort((a, b) => parseFloat(a.dist) - parseFloat(b.dist));
}

// ── FIND LOCATION FROM DATABASE ──
function findLocation(query) {
  query = query.toLowerCase().trim();
  // Exact match first
  let match = INDIA_LOCATIONS.find(l =>
    l.name.toLowerCase() === query ||
    l.state.toLowerCase() === query
  );
  // Partial match
  if(!match) {
    match = INDIA_LOCATIONS.find(l =>
      l.name.toLowerCase().includes(query) ||
      query.includes(l.name.toLowerCase())
    );
  }
  // State match
  if(!match) {
    match = INDIA_LOCATIONS.find(l =>
      l.state.toLowerCase().includes(query)
    );
  }
  return match;
}

// ── AUTOCOMPLETE SUGGESTIONS ──
function getSuggestions(query) {
  if(!query || query.length < 2) return [];
  query = query.toLowerCase();
  const seen = new Set();
  const results = [];
  for(const loc of INDIA_LOCATIONS) {
    const key = loc.name + loc.state;
    if(seen.has(key)) continue;
    if(loc.name.toLowerCase().includes(query) ||
       loc.state.toLowerCase().includes(query)) {
      seen.add(key);
      results.push(loc);
      if(results.length >= 8) break;
    }
  }
  return results;
}

function onSearchInput() {
  const q    = document.getElementById('searchInput').value;
  const sugg = getSuggestions(q);
  const box  = document.getElementById('suggestions');

  if(!sugg.length || !q) {
    box.classList.remove('show');
    return;
  }

  box.innerHTML = sugg.map(loc => `
    <div class="suggestion-item" onclick="selectSuggestion('${loc.name}', ${loc.lat}, ${loc.lng}, '${loc.state}')">
      <span class="suggestion-icon">&#128205;</span>
      <div>
        <div class="suggestion-name">${loc.name}</div>
        <div class="suggestion-state">${loc.state}</div>
      </div>
    </div>
  `).join('');
  box.classList.add('show');
}

function selectSuggestion(name, lat, lng, state) {
  document.getElementById('searchInput').value = name + ", " + state;
  document.getElementById('suggestions').classList.remove('show');
  searchLocation(lat, lng, name + ", " + state);
}

function onKeyDown(e) {
  if(e.key === 'Enter') {
    document.getElementById('suggestions').classList.remove('show');
    handleSearch();
  }
  if(e.key === 'Escape') {
    document.getElementById('suggestions').classList.remove('show');
  }
}

// Close suggestions on outside click
document.addEventListener('click', function(e) {
  if(!e.target.closest('.search-input-wrap')) {
    document.getElementById('suggestions').classList.remove('show');
  }
});

// ── SHOW PHARMACIES ──
function showPharmacies(list, centerLat, centerLng, locName) {
  clearMarkers();
  document.getElementById('countBadge').textContent = list.length + ' found';
  document.getElementById('sidebarLocation').textContent = locName;

  map.setView([centerLat, centerLng], 14);

  // User location marker
  const myM = L.marker([centerLat, centerLng], {icon: myIcon()}).addTo(map);
  myM.bindPopup(`<b style="color:#0d6e7a">&#128205; ${locName}</b>`);
  markers.push(myM);

  const listEl = document.getElementById('pharmacyList');
  listEl.innerHTML = '';

  list.forEach((p, i) => {
    const marker = L.marker([p.lat, p.lng], {icon: makeIcon()}).addTo(map);
    marker.bindPopup(`
      <div style="min-width:200px;font-family:'DM Sans',sans-serif;padding:4px">
        <b style="font-size:14px;color:#0a2a2f">${p.name}</b><br>
        <span style="font-size:12px;color:#6b9aa0">&#128205; ${p.address}</span><br><br>
        <span style="${p.open ? 'background:#e8f8ee;color:#1a7a3a' : 'background:#fef0f0;color:#c0392b'};padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700">
          ${p.open ? '&#9679; Open Now' : '&#9679; Closed'}
        </span><br><br>
        <span style="font-size:12px;color:#6b9aa0;line-height:2">
          &#128222; ${p.phone}<br>
          &#8987; ${p.hours}<br>
          &#11088; ${p.rating}/5 &nbsp; &#128663; ${p.dist}
        </span>
      </div>
    `);
    markers.push(marker);

    const card = document.createElement('div');
    card.className = 'pharmacy-card';
    card.id = 'card-' + i;
    card.innerHTML = `
      <div class="pharmacy-top">
        <div class="pharmacy-name">${p.name}</div>
        <span class="${p.open ? 'open-badge' : 'closed-badge'}">${p.open ? '&#9679; Open' : '&#9679; Closed'}</span>
      </div>
      <div class="pharmacy-addr">&#128205; ${p.address}</div>
      <div class="pharmacy-meta">
        <div class="meta-item">&#11088; <span>${p.rating}</span></div>
        <div class="meta-item">&#128337; <span>${p.hours}</span></div>
        <div class="meta-item">&#128663; <span>${p.dist}</span></div>
      </div>
      <div class="ph-actions">
        <button class="btn-dir" onclick="flyTo(${p.lat},${p.lng},${i+1})">&#128204; Directions</button>
        <button class="btn-call" onclick="alert('Calling ${p.phone}\\n(Demo number for hackathon)')">&#128222; Call</button>
      </div>
    `;
    card.onclick = function(e) {
      if(e.target.tagName === 'BUTTON') return;
      flyTo(p.lat, p.lng, i+1);
    };
    listEl.appendChild(card);
  });
}

function flyTo(lat, lng, idx) {
  map.flyTo([lat, lng], 17, {duration:1});
  if(markers[idx]) markers[idx].openPopup();
  document.querySelectorAll('.pharmacy-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card-' + (idx-1));
  if(card) { card.classList.add('active'); card.scrollIntoView({behavior:'smooth', block:'nearest'}); }
}

// ── SEARCH LOCATION ──
function searchLocation(lat, lng, name) {
  const pharmacies = generatePharmacies(lat, lng, name);
  showPharmacies(pharmacies, lat, lng, name);
}

// ── MAIN SEARCH HANDLER ──
async function handleSearch() {
  const query = document.getElementById('searchInput').value.trim();
  if(!query) { alert('Please enter a city, district or state!'); return; }

  document.getElementById('suggestions').classList.remove('show');

  // Step 1: Try our local database first (instant, no internet)
  const localMatch = findLocation(query);
  if(localMatch) {
    const name = localMatch.name + ", " + localMatch.state;
    searchLocation(localMatch.lat, localMatch.lng, name);
    return;
  }

  // Step 2: If not in local DB, try Nominatim API
  showLoading('Searching for ' + query + '...');
  try {
    const url  = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query + ' India')}&format=json&limit=1`;
    const res  = await fetch(url, {headers:{'Accept-Language':'en'}});
    const data = await res.json();

    if(data && data.length > 0) {
      const lat  = parseFloat(data[0].lat);
      const lng  = parseFloat(data[0].lon);
      const name = data[0].display_name.split(',').slice(0,2).join(', ');
      hideLoading();
      searchLocation(lat, lng, name);
    } else {
      hideLoading();
      alert('"' + query + '" not found. Try another city or state name.');
    }
  } catch(e) {
    hideLoading();
    alert('Search failed. Check your internet connection.');
  }
}

// ── MY LOCATION ──
function locateMe() {
  if(!navigator.geolocation) { alert('Geolocation not supported!'); return; }
  showLoading('Getting your location...');
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      let cityName = 'Your Location';
      try {
        const res  = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
        const data = await res.json();
        cityName = data.address?.city || data.address?.town || data.address?.village || data.address?.state || 'Your Location';
      } catch(e) {}
      document.getElementById('searchInput').value = cityName;
      hideLoading();
      searchLocation(lat, lng, cityName);
    },
    (err) => {
      hideLoading();
      alert('Could not get location. Please allow location access or search manually.');
    },
    {enableHighAccuracy:true, timeout:10000, maximumAge:0}
  );
}

function showLoading(msg) {
  document.getElementById('loadingText').textContent = msg;
  document.getElementById('loading').classList.remove('hidden');
}
function hideLoading() {
  document.getElementById('loading').classList.add('hidden');
}

// ── ENTER KEY ──
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if(e.key === 'Enter') { document.getElementById('suggestions').classList.remove('show'); handleSearch(); }
});

// ── AUTO LOAD Agra on start ──
window.onload = function() {
  const agra = findLocation('agra');
  if(agra) searchLocation(agra.lat, agra.lng, 'Agra, Uttar Pradesh');
};
</script>
